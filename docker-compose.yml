services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-group7db}
      POSTGRES_USER: ${POSTGRES_USER:-group7}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-group7pass}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-group7} -d ${POSTGRES_DB:-group7db}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - group7_net

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-group7pass}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_dbms_security_procedures_allowlist: gds.*
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - group7_net

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      TZ: UTC
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-group7db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-group7}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-group7pass}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-group7pass}
      JWT_SECRET: ${JWT_SECRET:-bXlTdXBlclNlY3JldEtleUZvckdyb3VwN0JhY2tlbmRBcHBsaWNhdGlvbjIwMjY=}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-onboarding@resend.dev}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      RESEND_API_KEY: ${RESEND_API_KEY:-re_test_placeholder}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:8000}
      APP_ADMIN_BOOTSTRAP_ENABLED: ${APP_ADMIN_BOOTSTRAP_ENABLED:-false}
      APP_ADMIN_BOOTSTRAP_EMAIL: ${APP_ADMIN_BOOTSTRAP_EMAIL:-}
      APP_ADMIN_BOOTSTRAP_PASSWORD: ${APP_ADMIN_BOOTSTRAP_PASSWORD:-}
      APP_ADMIN_BOOTSTRAP_FIRST_NAME: ${APP_ADMIN_BOOTSTRAP_FIRST_NAME:-System}
      APP_ADMIN_BOOTSTRAP_LAST_NAME: ${APP_ADMIN_BOOTSTRAP_LAST_NAME:-Admin}
      # Advanced mentor ranker (#436). Defaults keep the LLM/embedding paths
      # off; flip the flags in .env to enable.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-placeholder-disabled-set-OPENAI_API_KEY-to-enable}
      MENTOR_ADVANCED_RANKER: ${MENTOR_ADVANCED_RANKER:-false}
      MENTOR_EXPLANATION_ENABLED: ${MENTOR_EXPLANATION_ENABLED:-false}
      MENTOR_EXPLANATION_TIMEOUT_MS: ${MENTOR_EXPLANATION_TIMEOUT_MS:-3000}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      # Advanced For-You feed ranker (#438). Default off; flip
      # FEED_ADVANCED_RANKER=true in .env to swap the InterestOverlapFeedRanker
      # for AdvancedForYouFeedRanker (+ pipeline). FEED_BANDIT_ENABLED stays
      # off until the impression-tracking follow-up PR lands.
      FEED_ADVANCED_RANKER: ${FEED_ADVANCED_RANKER:-false}
      FEED_BANDIT_ENABLED: ${FEED_BANDIT_ENABLED:-false}
      # E2E / Playwright fixtures rely on /api/test/* seed-and-reset
      # endpoints and on the spam-bot defences being off so registrations
      # don't need a real form-token round-trip. Default off in production;
      # CI / local Playwright runs flip them on via .env.
      APP_TEST_ENDPOINTS_ENABLED: ${APP_TEST_ENDPOINTS_ENABLED:-false}
      APP_SPAM_ENABLED: ${APP_SPAM_ENABLED:-true}
      # Verification-email send swaps to NoOpEmailService when off — used by
      # Playwright so /api/test/users registrations don't fail with Resend
      # 401 when the API key is the placeholder.
      APP_EMAIL_ENABLED: ${APP_EMAIL_ENABLED:-true}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - group7_net

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8000}:8000"
    environment:
      VITE_BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - group7_net

volumes:
  db_data:
  uploads_data:
  neo4j_data:
  neo4j_plugins:

networks:
  group7_net:
