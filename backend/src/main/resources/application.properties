spring.application.name=group7-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/group7db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:group7}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:group7pass}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.jackson.serialization.write-dates-as-timestamps=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckdyb3VwN0JhY2tlbmRBcHBsaWNhdGlvbjIwMjY=}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.mail.from=${APP_MAIL_FROM:noreply@group7.com}
app.verification.token-expiry-hours=${VERIFICATION_TOKEN_EXPIRY_HOURS:24}
app.verification.resend-max-per-hour=${VERIFICATION_RESEND_MAX_PER_HOUR:3}
app.password-reset.token-expiry-hours=${PASSWORD_RESET_TOKEN_EXPIRY_HOURS:1}
app.password-reset.max-requests-per-hour=${PASSWORD_RESET_MAX_REQUESTS_PER_HOUR:5}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# File uploads (max 5MB images / attachments)
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_SIZE:5MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_SIZE:6MB}
app.upload.dir=${UPLOAD_DIR:/app/uploads/photos}
app.upload.attachments-dir=${UPLOAD_ATTACHMENTS_DIR:/app/uploads/attachments}
app.upload.max-file-size=${UPLOAD_MAX_SIZE_BYTES:5242880}
# Per-user hourly attachment-upload quota. Each authenticated user may store at
# most this many files in any rolling 60-minute window. Bounds disk-fill DoS
# until the global rate-limit middleware (#252/#302) lands.
app.upload.max-per-user-per-hour=${UPLOAD_MAX_PER_USER_PER_HOUR:30}
# Orphan-attachment retention. Files uploaded but never referenced by any
# Message are reclaimed by the scheduler after this many hours.
app.upload.orphan-retention-hours=${UPLOAD_ORPHAN_RETENTION_HOURS:24}

# Actuator (for Docker healthchecks)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# Default to redacting `details` from anonymous /actuator/health responses.
# Individual indicators can still report UP/DOWN/OUT_OF_SERVICE but the
# `reason` strings (which include exception class names) and the
# `vectorDimension` from the embedding probe are hidden from unauth callers.
management.endpoint.health.show-details=when-authorized

resend.api-key=${RESEND_API_KEY:re_test_placeholder}

# Outbound email switch. Set to false in CI/E2E so the verification and
# password-reset rows are still persisted but the Resend HTTP call is skipped
# (NoOpEmailService takes over). Production must keep this true.
app.email.enabled=${APP_EMAIL_ENABLED:true}

# Profile-gated test-support controller (#315). When true, /api/test/{reset,
# verification-token,password-reset-token,users} are wired so Playwright can
# fetch tokens and reset state without touching real email. MUST be false in
# any production-shaped deployment; defence-in-depth in SecurityConfig 404s
# the path when this is off.
app.test-endpoints.enabled=${APP_TEST_ENDPOINTS_ENABLED:false}

# Admin bootstrap (disabled by default; enable in deploy env only)
app.admin-bootstrap.enabled=${APP_ADMIN_BOOTSTRAP_ENABLED:false}
app.admin-bootstrap.email=${APP_ADMIN_BOOTSTRAP_EMAIL:}
app.admin-bootstrap.password=${APP_ADMIN_BOOTSTRAP_PASSWORD:}
app.admin-bootstrap.first-name=${APP_ADMIN_BOOTSTRAP_FIRST_NAME:System}
app.admin-bootstrap.last-name=${APP_ADMIN_BOOTSTRAP_LAST_NAME:Admin}

# Rate limiting (per-IP / per-user; in-memory; single-replica)
# Trust X-Forwarded-For ONLY behind reverse proxies that append (never blindly
# forward) client-supplied XFF. trusted-proxies-count must equal the number of
# such proxies between this app and the public internet (e.g. CDN + ALB = 2).
# A wrong value lets an attacker spoof the rate-limit key — see
# PRODUCTION_CHECKLIST.md for the deployment matrix.
app.ratelimit.enabled=${APP_RATELIMIT_ENABLED:true}
app.ratelimit.trust-forwarded-for=${APP_RATELIMIT_TRUST_XFF:false}
app.ratelimit.trusted-proxies-count=${APP_RATELIMIT_TRUSTED_PROXIES:1}

app.ratelimit.rules.auth-login.method=POST
app.ratelimit.rules.auth-login.pattern=/api/auth/login
app.ratelimit.rules.auth-login.key-strategy=IP
app.ratelimit.rules.auth-login.capacity=10
app.ratelimit.rules.auth-login.refill=PT1M

app.ratelimit.rules.auth-register.method=POST
app.ratelimit.rules.auth-register.pattern=/api/auth/register
app.ratelimit.rules.auth-register.key-strategy=IP
# Tightened from 5 → 3/min as part of the spam-bot defences (#345).
app.ratelimit.rules.auth-register.capacity=3
app.ratelimit.rules.auth-register.refill=PT1M

# IP-keyed cap on the form-render token endpoint (#345). Generous (30/min)
# because legitimate retries on a form refresh hit this; tight enough to
# stop offline harvesting of pre-signed tokens.
app.ratelimit.rules.auth-form-token.method=GET
app.ratelimit.rules.auth-form-token.pattern=/api/auth/form-token
app.ratelimit.rules.auth-form-token.key-strategy=IP
app.ratelimit.rules.auth-form-token.capacity=30
app.ratelimit.rules.auth-form-token.refill=PT1M

app.ratelimit.rules.auth-forgot-password.method=POST
app.ratelimit.rules.auth-forgot-password.pattern=/api/auth/forgot-password
app.ratelimit.rules.auth-forgot-password.key-strategy=IP
app.ratelimit.rules.auth-forgot-password.capacity=5
app.ratelimit.rules.auth-forgot-password.refill=PT1H

app.ratelimit.rules.mentorship-request-create.method=POST
app.ratelimit.rules.mentorship-request-create.pattern=/api/mentorship-requests
app.ratelimit.rules.mentorship-request-create.key-strategy=USER
app.ratelimit.rules.mentorship-request-create.capacity=20
app.ratelimit.rules.mentorship-request-create.refill=PT1H

app.ratelimit.rules.message-send.method=POST
app.ratelimit.rules.message-send.pattern=/api/mentorships/*/messages
app.ratelimit.rules.message-send.key-strategy=USER
app.ratelimit.rules.message-send.capacity=60
app.ratelimit.rules.message-send.refill=PT1M

app.ratelimit.rules.mentor-pair-message-send.method=POST
app.ratelimit.rules.mentor-pair-message-send.pattern=/api/conversations/mentor-pair/*/messages
app.ratelimit.rules.mentor-pair-message-send.key-strategy=USER
app.ratelimit.rules.mentor-pair-message-send.capacity=60
app.ratelimit.rules.mentor-pair-message-send.refill=PT1M

# USER-keyed cap on the follow / unfollow endpoints (#343). Two rules
# because RateLimitRule binds a single HttpMethod per rule — sharing the
# same envelope (60/min) prevents a malicious client from doubling the
# effective rate by alternating POST and DELETE on the same target.
app.ratelimit.rules.follow-create.method=POST
app.ratelimit.rules.follow-create.pattern=/api/users/*/follow
app.ratelimit.rules.follow-create.key-strategy=USER
app.ratelimit.rules.follow-create.capacity=60
app.ratelimit.rules.follow-create.refill=PT1M

app.ratelimit.rules.follow-delete.method=DELETE
app.ratelimit.rules.follow-delete.pattern=/api/users/*/follow
app.ratelimit.rules.follow-delete.key-strategy=USER
app.ratelimit.rules.follow-delete.capacity=60
app.ratelimit.rules.follow-delete.refill=PT1M

# USER-keyed cap on feed-post creation (#348). 30/hour by default; the
# capacity is env-overridable so the demo can lift it temporarily without
# committing the change. PATCH/DELETE/GET are unmetered — author-only checks
# are sufficient gates on those.
app.ratelimit.rules.feed-post-create.method=POST
app.ratelimit.rules.feed-post-create.pattern=/api/feed/posts
app.ratelimit.rules.feed-post-create.key-strategy=USER
app.ratelimit.rules.feed-post-create.capacity=${APP_FEED_POST_CAPACITY:30}
app.ratelimit.rules.feed-post-create.refill=PT1H

# Feed unread-count display cap (#349). 99 mirrors the common UI
# "99+" pattern. The COUNT query short-circuits at LIMIT cap+1 so the
# scan stops once we know the answer is "≥ cap"; we never read all
# unread rows when the cap suffices. Env-overrideable for demos.
app.feed.unread.cap=${APP_FEED_UNREAD_CAP:99}

# EmailService dev escape hatch (#349 polish). When false, the
# verification + password-reset paths log the link at WARN instead of
# calling Resend. Lets a fresh-DB dev/manual-smoke run register users
# without depending on a valid RESEND_API_KEY (the placeholder key is
# rejected by Resend's validation). Default true; prod is unchanged.
app.email.enabled=${APP_EMAIL_ENABLED:true}

# USER-keyed caps on feed interactions (#347). Each interaction type has
# its own bucket because RateLimitRule's AntPathMatcher doesn't support
# brace alternation; same envelope (60/min) for all.
app.ratelimit.rules.feed-like.method=POST
app.ratelimit.rules.feed-like.pattern=/api/feed/posts/*/like
app.ratelimit.rules.feed-like.key-strategy=USER
app.ratelimit.rules.feed-like.capacity=${APP_FEED_INTERACTION_CAPACITY:60}
app.ratelimit.rules.feed-like.refill=PT1M

app.ratelimit.rules.feed-bookmark.method=POST
app.ratelimit.rules.feed-bookmark.pattern=/api/feed/posts/*/bookmark
app.ratelimit.rules.feed-bookmark.key-strategy=USER
app.ratelimit.rules.feed-bookmark.capacity=${APP_FEED_INTERACTION_CAPACITY:60}
app.ratelimit.rules.feed-bookmark.refill=PT1M

app.ratelimit.rules.feed-share.method=POST
app.ratelimit.rules.feed-share.pattern=/api/feed/posts/*/share
app.ratelimit.rules.feed-share.key-strategy=USER
app.ratelimit.rules.feed-share.capacity=${APP_FEED_INTERACTION_CAPACITY:60}
app.ratelimit.rules.feed-share.refill=PT1M

# Repost / quote-share fanout. Tighter than the silent /share cap because
# every repost triggers a STOMP broadcast to the sharer's followers and
# carries higher abuse cost than an analytics-only event.
app.ratelimit.rules.feed-repost.method=POST
app.ratelimit.rules.feed-repost.pattern=/api/feed/posts/*/reposts
app.ratelimit.rules.feed-repost.key-strategy=USER
app.ratelimit.rules.feed-repost.capacity=${APP_FEED_REPOST_CAPACITY:30}
app.ratelimit.rules.feed-repost.refill=PT1M

app.ratelimit.rules.feed-comment.method=POST
app.ratelimit.rules.feed-comment.pattern=/api/feed/posts/*/comments
app.ratelimit.rules.feed-comment.key-strategy=USER
app.ratelimit.rules.feed-comment.capacity=${APP_FEED_INTERACTION_CAPACITY:60}
app.ratelimit.rules.feed-comment.refill=PT1M

# IP-keyed cap on the anonymous iCalendar export endpoint (#250). The path
# is permitAll so calendar apps can subscribe; this rule prevents drive-by
# enumeration of mentor IDs. 30/min per IP is generous for legitimate
# subscription refreshes (calendar apps poll hourly at most).
app.ratelimit.rules.availability-ical.method=GET
app.ratelimit.rules.availability-ical.pattern=/api/availability/*/ical
app.ratelimit.rules.availability-ical.key-strategy=IP
app.ratelimit.rules.availability-ical.capacity=30
app.ratelimit.rules.availability-ical.refill=PT1M

# For-You feed ranker weights (#350). Default weights sum to 1.0 so the
# composite score is bounded in [0, 1]. Tuning happens here without code
# changes; a future AI-driven ranker would plug in behind @Primary and
# could ignore these properties entirely.
app.feed.forYou.weights.interest=${FEED_FORYOU_WEIGHT_INTEREST:0.5}
app.feed.forYou.weights.timeDecay=${FEED_FORYOU_WEIGHT_TIME_DECAY:0.3}
app.feed.forYou.weights.followBoost=${FEED_FORYOU_WEIGHT_FOLLOW_BOOST:0.2}
# Half-life of the time-decay term. A post one half-life old scores 0.5 on
# this axis; older posts asymptote toward 0. Default 24h matches the
# typical "fresh content" window for a social feed.
app.feed.forYou.weights.timeDecay.halfLife=${FEED_FORYOU_TIME_HALF_LIFE:PT24H}

# Oversample window for the For-You feed (#350). The SQL layer fetches up
# to this many recent candidates by created_at desc, the ranker scores
# them in memory, and the page is sliced from the in-memory ranking.
# Pages beyond the window return empty content. Tune up if user activity
# grows; tune down if memory becomes a concern.
app.feed.forYou.candidate-window=${FEED_FORYOU_CANDIDATE_WINDOW:200}

# Advanced For-You feed ranker. Off by default — production stays on the
# legacy InterestOverlapFeedRanker until the advanced ranker is validated.
# Flip the master switch in .env or via env var to swap in the advanced
# ranker as @Primary (no other code change required).
app.recommendations.feed.advanced.enabled=${FEED_ADVANCED_RANKER:false}

# Signal weights — sum to 1.00 so the composite score is bounded [0, 1].
# Semantic 0.40 (replaces hashtag-Jaccard), engagement 0.20 (new),
# author-affinity 0.15 (replaces flat follow-boost), time-decay 0.25
# (residual from the legacy ranker).
app.recommendations.feed.weights.semantic-match=0.40
app.recommendations.feed.weights.engagement=0.20
app.recommendations.feed.weights.author-affinity=0.15
app.recommendations.feed.weights.time-decay=0.25

# Per-signal kill switches. Disabling a signal makes it contribute 0 with
# no factor emitted (distinct from runtime failure, which still emits a
# *-unavailable factor). Weights are NOT renormalized — the score ceiling
# drops, the distribution shape stays.
app.recommendations.feed.signals.semantic-match-enabled=true
app.recommendations.feed.signals.engagement-enabled=true
app.recommendations.feed.signals.author-affinity-enabled=true
app.recommendations.feed.signals.time-decay-enabled=true

# Time-decay tuning. half-life matches the legacy ranker (24h) so the
# advanced ranker doesn't shift the recency curve on rollout. fresh-hours
# controls when the informational feed:fresh chip fires.
app.recommendations.feed.time-decay.half-life=PT24H
app.recommendations.feed.time-decay.fresh-hours=6

# Author-affinity tuning. window-days bounds the SQL look-back for
# viewer→author engagement counts. follow-base-score is the bonus added
# when the viewer follows the author even with zero engagement, so a
# brand-new follow scores meaningfully. saturation-count is the weighted
# count at which the engagement term hits 1.0.
app.recommendations.feed.affinity.window-days=30
app.recommendations.feed.affinity.follow-base-score=0.30
app.recommendations.feed.affinity.saturation-count=10

# MMR diversification — applied after the weighted-sum sort over the
# top window-multiplier × pageSize candidates. lambda=0.7 leans toward
# relevance; the most-lifted item earns a feed:diverse-pick chip.
app.recommendations.feed.mmr.enabled=true
app.recommendations.feed.mmr.lambda=0.7
app.recommendations.feed.mmr.window-multiplier=3

# Diversity floor — ensures ≥1 post outside the top-N hashtags from the
# candidate window on page 0. Swaps the lowest-scoring slot when needed.
app.recommendations.feed.diversity-floor.enabled=true
app.recommendations.feed.diversity-floor.top-hashtags-count=3

# Thompson-sampling bandit exploration. Off by default — flip to true
# only after the impression-tracking follow-up PR lands (without β
# updates, the bandit degrades to a popularity ranker once any α
# exceeds ~50). exploration-rate is the fraction of page-0 slots
# reserved for bandit picks.
app.recommendations.feed.bandit.enabled=${FEED_BANDIT_ENABLED:false}
app.recommendations.feed.bandit.exploration-rate=0.10

# In-memory oversample window for the matching pipeline (#262/#273). The SQL
# layer fetches up to this many candidates ordered by id DESC, the ranker
# scores them in memory, and the page is sliced from the in-memory ranking.
# Pages beyond the window return empty content. Tune up if the user base
# grows and frontend pagination needs to reach further; tune down if memory
# becomes a concern (each candidate carries its full DTO + collections).
# Reused by the follow-recommendation pipeline (#344) under the same trade-off.
app.matching.ranking-window=${MATCH_RANKING_WINDOW:200}

# Follow-recommendation scoring weights (#344). Per-signal multipliers used
# by RuleBasedFollowRanker; tune to bias the algorithm without code changes.
#   interest-weight       — score added per shared interest label.
#   follow-graph-weight   — score added per "viewer's-followee follows them" edge.
app.recommendations.interest-weight=${RECOMMENDATIONS_INTEREST_WEIGHT:3}
app.recommendations.follow-graph-weight=${RECOMMENDATIONS_FOLLOW_GRAPH_WEIGHT:2}

# Scheduled match-found notification job (#273). Daily 09:00 UTC by default.
# `enabled=false` skips bean creation entirely; `cron=-` keeps the bean wired
# but suppresses firings (Spring 5.1+ documents "-" as the disable marker).
# The cron property must be a valid six-field cron expression OR "-"; empty
# or invalid values fail Spring's CronExpression.parse at startup.
app.matching.notification.enabled=${MATCH_NOTIFICATION_ENABLED:true}
app.matching.notification.cron=${MATCH_NOTIFICATION_CRON:0 0 9 * * *}
app.matching.notification.zone=${MATCH_NOTIFICATION_ZONE:UTC}

# Meeting scheduling — reminders and confirmation window (#246)
app.meetings.reminder-offset-hours=${MEETING_REMINDER_OFFSET_HOURS:24,1}
app.meetings.reminder-window-minutes=${MEETING_REMINDER_WINDOW_MINUTES:5}
app.meetings.confirmation-window-hours=${MEETING_CONFIRMATION_WINDOW_HOURS:24}
app.meetings.confirmation-min-hours-before-start=${MEETING_CONFIRMATION_MIN_HOURS_BEFORE_START:1}
app.meetings.scheduler.enabled=${MEETING_SCHEDULER_ENABLED:true}
app.meetings.scheduler.cron=${MEETING_SCHEDULER_CRON:0 */5 * * * *}
app.meetings.scheduler.zone=${MEETING_SCHEDULER_ZONE:UTC}

# Push notification transport (FCM, #136). When app.fcm.enabled=true AND
# app.fcm.credentials-path resolves to a readable Firebase service-account
# JSON, FcmConfig wires FcmPushDeliveryService; otherwise it falls back to
# NoOpPushDeliveryService so dev / CI environments boot cleanly without
# credentials. The path is on the local filesystem (no classpath fallback);
# operators set FCM_CREDENTIALS_PATH to the absolute path of the JSON pulled
# from the Firebase console.
app.fcm.enabled=${FCM_ENABLED:true}
app.fcm.credentials-path=${FCM_CREDENTIALS_PATH:}

# Maximum FCM device tokens retained per user. Registering a new token when
# the user is at the cap evicts the oldest device by last_seen_at, in code
# (UserDeviceService.register), not via a DB constraint.
app.devices.max-per-user=${USER_DEVICES_MAX:5}

# Automatic temporary ban system (#134, req 2.2.4). Geometric escalation:
# the first cancellationThreshold-1 cancels are warning territory, then
# ban N gets `firstBanHours * escalationFactor^(N-1)` hours, capped at
# maxBanHours. All values configurable per-deployment.
app.bans.cancellation-threshold=${BAN_CANCEL_THRESHOLD:3}
app.bans.first-ban-hours=${BAN_FIRST_HOURS:24}
app.bans.escalation-factor=${BAN_ESCALATION_FACTOR:2}
app.bans.max-ban-hours=${BAN_MAX_HOURS:720}

# BanExpiryScheduler — hourly UTC sweep that fires BAN_EXPIRED once per
# expired ban. `enabled=false` skips bean creation entirely (the timer
# itself still expires bans automatically; only the notification is lost).
app.bans.expiry-notification-enabled=${BAN_EXPIRY_NOTIFY_ENABLED:true}
app.bans.expiry-notification.cron=${BAN_EXPIRY_NOTIFY_CRON:0 0 * * * *}
app.bans.expiry-notification.zone=${BAN_EXPIRY_NOTIFY_ZONE:UTC}

# Mentorship cancellation cool-down (#133). After a mentorship terminates,
# the same (mentor, mentee) pair cannot re-request or re-accept until this
# window has elapsed. ISO-8601 Duration; default = 168h = 7 days. Override
# in deploy via MENTORSHIP_COOLDOWN_DURATION (e.g. PT24H, P30D).
app.mentorship.cooldown.duration=${MENTORSHIP_COOLDOWN_DURATION:PT168H}

# Mentorship auto-completion sweep (#237). Hourly UTC cron flips ACTIVE
# mentorships whose end_date has passed to COMPLETED, deletes their child
# data (meetings, tasks, milestones, conversations), audits the transition,
# and notifies both participants. enabled=false skips the bean entirely.
app.mentorships.auto-completion.enabled=${MENTORSHIP_AUTO_COMPLETE_ENABLED:true}
app.mentorships.auto-completion.cron=${MENTORSHIP_AUTO_COMPLETE_CRON:0 0 * * * *}
app.mentorships.auto-completion.zone=${MENTORSHIP_AUTO_COMPLETE_ZONE:UTC}

# Spam-bot detection layered defences (NFR 2.2.5). The form-token
# secret is mandatory in production; the dev default exists only so a
# fresh-clone build doesn't fail validation. Tune thresholds without a
# redeploy by overriding APP_SPAM_* env vars.
app.spam.form-token-secret=${APP_SPAM_FORM_TOKEN_SECRET:dev-spam-secret-do-not-use-in-prod}
app.spam.form-token-ttl=${APP_SPAM_FORM_TOKEN_TTL:PT15M}
app.spam.min-submit-seconds=${APP_SPAM_MIN_SUBMIT_SECONDS:1.5}
app.spam.email-bucket.capacity=${APP_SPAM_EMAIL_BUCKET_CAPACITY:3}
app.spam.email-bucket.refill=${APP_SPAM_EMAIL_BUCKET_REFILL:PT1H}
app.spam.auto-ban.signal-threshold=${APP_SPAM_AUTOBAN_THRESHOLD:3}
app.spam.auto-ban.window=${APP_SPAM_AUTOBAN_WINDOW:PT10M}
app.spam.auto-ban.duration-hours=${APP_SPAM_AUTOBAN_HOURS:24}
app.spam.signal-retention-days=${APP_SPAM_RETENTION_DAYS:90}
app.spam.cleanup-cron=${APP_SPAM_CLEANUP_CRON:0 30 3 * * *}

# ───── Advanced mentor ranker ─────
# Master switch. When false the legacy RuleBasedMentorRanker stays @Primary
# and AdvancedMentorRanker bean is never instantiated — so the embedding /
# LLM code paths are genuinely off, not just bypassed.
app.recommendations.mentor.advanced.enabled=${MENTOR_ADVANCED_RANKER:false}

# Weights — should sum to ~1.0. Final matchScore = clamp(Σ wᵢ·scoreᵢ, 0, 1)·100.
#
# Proximity is intentionally a soft signal here (0.05): the dedicated
# "slot 1 = nearest" layer already gives location its first-class treatment
# in the page layout, so the *weighted score* doesn't need to favour close
# mentors heavily. Within-country distance differences (1 km vs 50 km)
# should barely shift the score; intercontinental still drops to ~0 via
# the exponential decay.
app.recommendations.mentor.weights.semantic-match=0.40
app.recommendations.mentor.weights.shared-interests=0.10
app.recommendations.mentor.weights.shared-skills=0.10
app.recommendations.mentor.weights.major-exact=0.10
app.recommendations.mentor.weights.major-field=0.05
app.recommendations.mentor.weights.availability=0.20
app.recommendations.mentor.weights.proximity=0.05

# Per-signal kill switches. Useful for ablation / debugging in dev.
app.recommendations.mentor.signals.semantic-match-enabled=true
app.recommendations.mentor.signals.shared-interests-enabled=true
app.recommendations.mentor.signals.shared-skills-enabled=true
app.recommendations.mentor.signals.major-enabled=true
app.recommendations.mentor.signals.availability-enabled=true
app.recommendations.mentor.signals.proximity-enabled=true

# Proximity decay (km) — score = exp(-distance / decayKm). 20 km is a
# metro-area tuning: ~0.95 at 1 km, ~0.78 at 5 km, ~0.61 at 10 km,
# ~0.37 at 20 km, ~0.08 at 50 km, ~0.007 at 100 km. Mentors within the
# same metro score high; anything past commuting range collapses to
# zero. Combined with the low proximity weight (0.05) the absolute
# score impact is small either way — slot 1 is where location really
# matters; the weighted signal is just a tiebreaker.
app.recommendations.mentor.proximity.decay-km=20
app.recommendations.mentor.proximity.city-match-bonus=0.2

# LLM prose explanations (spec 1.1.2.5). Deterministic factor strings are
# always emitted; this layer adds a natural-language sentence per match
# on top, via OpenAI gpt-4o-mini. Failures, timeouts, or cache misses past
# the daily call cap all fall back to null prose and the frontend formats
# the factor strings instead — the response never fails because of this.
app.recommendations.mentor.explanation.enabled=${MENTOR_EXPLANATION_ENABLED:false}
app.recommendations.mentor.explanation.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
app.recommendations.mentor.explanation.timeout-ms=${MENTOR_EXPLANATION_TIMEOUT_MS:3000}
app.recommendations.mentor.explanation.cache.max-size=5000
app.recommendations.mentor.explanation.cache.ttl-minutes=30
app.recommendations.mentor.explanation.daily-call-cap=10000

# Spring AI chat options — picked up by the auto-wired ChatModel bean.
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.4

# ───── Semantic embedding service ─────
# OpenAI text-embedding-3-small (1536 dims) for the advanced mentor
# ranker's semantic-match signal and MMR similarity metric. The starter
# auto-wires an EmbeddingModel bean from spring.ai.openai.api-key; when
# the key is missing or the call fails, SemanticSimilarityService returns
# an empty vector and the signal scores 0 (factor: semantic-unavailable).
# Default is a placeholder, not blank. Spring AI 1.0.x rejects an empty
# api-key at bean creation time even when the OpenAI code paths are
# never exercised (advanced ranker / explanation flag off). The
# placeholder lets the EmbeddingModel + ChatModel beans wire cleanly;
# any real call (only happens when the flags are flipped on) fails
# with 401 from OpenAI and degrades through the graceful-degradation
# contracts (semantic-unavailable factor / null prose).
spring.ai.openai.api-key=${OPENAI_API_KEY:placeholder-disabled-set-OPENAI_API_KEY-to-enable}
spring.ai.openai.embedding.options.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# Disable the OpenAI auto-configurations we don't use. Spring AI 1.0.x
# auto-wires beans for audio/image/moderation as soon as the starter jar
# is on the classpath; their constructors do a stricter API-key check
# than the chat/embedding side and refuse to boot with the placeholder
# key. Excluding them removes the dead bean graphs we never call.
spring.autoconfigure.exclude=\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
app.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
app.embedding.cache.max-size=${EMBEDDING_CACHE_MAX_SIZE:10000}
app.embedding.cache.ttl-hours=${EMBEDDING_CACHE_TTL_HOURS:24}
app.embedding.fail-open=${EMBEDDING_FAIL_OPEN:true}
