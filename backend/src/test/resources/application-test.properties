spring.datasource.url=jdbc:postgresql://localhost:5433/group7db
spring.datasource.username=group7
spring.datasource.password=group7pass

# Test-only Hikari tuning. Spring's TestContextCache keeps multiple
# ApplicationContexts alive across the suite (one per @TestPropertySource
# / @MockitoBean combination); each one defaults to a 10-connection
# Hikari pool. Combined across the ~10 context-loading test classes in
# this project, that's 100+ connections — past PG's default
# max_connections in CI. Cap to 2 + drain idle to 0 so contexts release
# slots as soon as they finish.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

jwt.secret=bXlTdXBlclNlY3JldEtleUZvckdyb3VwN0JhY2tlbmRBcHBsaWNhdGlvbjIwMjY=
jwt.expiration=86400000

app.base-url=http://localhost:8080
app.frontend-url=http://localhost:5173
app.mail.from=noreply@group7.com
app.verification.token-expiry-hours=24
app.verification.resend-max-per-hour=3
app.password-reset.token-expiry-hours=1
app.password-reset.max-requests-per-hour=5

# File uploads (use temp dirs for tests)
app.upload.dir=${java.io.tmpdir}/group7-test-uploads
app.upload.attachments-dir=${java.io.tmpdir}/group7-test-attachments
app.upload.max-file-size=5242880

# Admin bootstrap explicitly disabled in tests
app.admin-bootstrap.enabled=false

# Rate limiting is OFF in the default test profile so the bulk suite is not
# coupled to bucket capacities or refill windows. Tests that need to exercise
# the limiter must opt in explicitly via @SpringBootTest(properties = {
#     "app.ratelimit.enabled=true",
#     "app.ratelimit.rules.<rule>.capacity=<small-number>"
# }) — see RateLimitIntegrationTest for the canonical setup. Do NOT flip this
# on globally; it would couple every other integration test to the limiter.
app.ratelimit.enabled=false

# Scheduled match-notification job (#273) is OFF in the default test profile so
# @SpringBootTest contexts don't spin up the bean and risk a stray cron firing
# during a test run. The dedicated MatchNotificationIntegrationTest overrides
# this via @TestPropertySource to enable the bean while keeping the cron
# disabled (cron="-").
app.matching.notification.enabled=false

# Meeting scheduler is OFF by default in tests; integration tests can opt in.
app.meetings.scheduler.enabled=false

# BanExpiryScheduler (#134) — same pattern. Off by default; BanIntegrationTest
# opts in via @TestPropertySource to invoke sweepExpired() directly.
app.bans.expiry-notification-enabled=false

app.reminders.notification.enabled=false

# MentorshipAutoCompletionScheduler (#237) — same pattern. Off by default;
# tests invoke autoCompleteExpired() directly via the service so they don't
# depend on a real cron firing.
app.mentorships.auto-completion.enabled=false

# Spam-bot detection is OFF in the default test profile so the bulk
# suite is not coupled to form-token round-trips or honeypot fields. The
# dedicated SpamBotDetectionIntegrationTest flips this on via @SpringBootTest
# properties to exercise the layer end-to-end.
app.spam.enabled=false

# Spring AI — placeholder API key so the EmbeddingModel/ChatModel beans
# bind without trying to phone home during boot. Unit tests inject mocks
# directly; any integration test that wires the real beans does so via
# @MockBean EmbeddingModel / ChatModel. A real outbound call from CI is
# both unwanted (cost, flake risk) and would 401 with this key — failure
# falls through SemanticSimilarityService.degradeOnce() and the matcher
# emits a `semantic-unavailable` factor instead of throwing.
spring.ai.openai.api-key=test-key-do-not-use
app.embedding.cache.max-size=128
app.embedding.cache.ttl-hours=1

# Advanced For-You feed ranker — off by default in tests so the bulk
# suite continues to use the legacy InterestOverlapFeedRanker.
# AdvancedForYouFeedIntegrationTest flips the master switch explicitly
# via @TestPropertySource.
app.recommendations.feed.advanced.enabled=false
app.recommendations.feed.weights.semantic-match=0.40
app.recommendations.feed.weights.engagement=0.20
app.recommendations.feed.weights.author-affinity=0.15
app.recommendations.feed.weights.time-decay=0.25
app.recommendations.feed.signals.semantic-match-enabled=true
app.recommendations.feed.signals.engagement-enabled=true
app.recommendations.feed.signals.author-affinity-enabled=true
app.recommendations.feed.signals.time-decay-enabled=true
app.recommendations.feed.time-decay.half-life=PT24H
app.recommendations.feed.time-decay.fresh-hours=6
app.recommendations.feed.affinity.window-days=30
app.recommendations.feed.affinity.follow-base-score=0.30
app.recommendations.feed.affinity.saturation-count=10
app.recommendations.feed.mmr.enabled=true
app.recommendations.feed.mmr.lambda=0.7
app.recommendations.feed.mmr.window-multiplier=3
app.recommendations.feed.diversity-floor.enabled=true
app.recommendations.feed.diversity-floor.top-hashtags-count=3
app.recommendations.feed.bandit.enabled=false
app.recommendations.feed.bandit.exploration-rate=0.10

# Feed soft-delete cleanup scheduler is OFF by default in tests so
# @SpringBootTest contexts don't spin up the bean and risk a stray cron
# firing during a test run. The dedicated
# FeedSoftDeleteCleanupIntegrationTest flips this on via @TestPropertySource
# and invokes the scheduler method directly.
app.feed.cleanup.enabled=false

# Feed trending refresh scheduler (#487) — same gating pattern. The
# dedicated FeedTrendingIntegrationTest opts in via @TestPropertySource
# and triggers refresh() directly.
app.feed.trending.enabled=false
