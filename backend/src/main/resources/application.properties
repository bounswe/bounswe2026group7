spring.application.name=group7-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/group7db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:group7}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:group7pass}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.jackson.serialization.write-dates-as-timestamps=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckdyb3VwN0JhY2tlbmRBcHBsaWNhdGlvbjIwMjY=}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.mail.from=${APP_MAIL_FROM:noreply@group7.com}
app.verification.token-expiry-hours=${VERIFICATION_TOKEN_EXPIRY_HOURS:24}
app.verification.resend-max-per-hour=${VERIFICATION_RESEND_MAX_PER_HOUR:3}
app.password-reset.token-expiry-hours=${PASSWORD_RESET_TOKEN_EXPIRY_HOURS:1}
app.password-reset.max-requests-per-hour=${PASSWORD_RESET_MAX_REQUESTS_PER_HOUR:5}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# File uploads (max 5MB images / attachments)
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_SIZE:5MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_SIZE:6MB}
app.upload.dir=${UPLOAD_DIR:/app/uploads/photos}
app.upload.attachments-dir=${UPLOAD_ATTACHMENTS_DIR:/app/uploads/attachments}
app.upload.max-file-size=${UPLOAD_MAX_SIZE_BYTES:5242880}
# Per-user hourly attachment-upload quota. Each authenticated user may store at
# most this many files in any rolling 60-minute window. Bounds disk-fill DoS
# until the global rate-limit middleware (#252/#302) lands.
app.upload.max-per-user-per-hour=${UPLOAD_MAX_PER_USER_PER_HOUR:30}
# Orphan-attachment retention. Files uploaded but never referenced by any
# Message are reclaimed by the scheduler after this many hours.
app.upload.orphan-retention-hours=${UPLOAD_ORPHAN_RETENTION_HOURS:24}

# Actuator (for Docker healthchecks)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

resend.api-key=${RESEND_API_KEY:re_test_placeholder}

# Admin bootstrap (disabled by default; enable in deploy env only)
app.admin-bootstrap.enabled=${APP_ADMIN_BOOTSTRAP_ENABLED:false}
app.admin-bootstrap.email=${APP_ADMIN_BOOTSTRAP_EMAIL:}
app.admin-bootstrap.password=${APP_ADMIN_BOOTSTRAP_PASSWORD:}
app.admin-bootstrap.first-name=${APP_ADMIN_BOOTSTRAP_FIRST_NAME:System}
app.admin-bootstrap.last-name=${APP_ADMIN_BOOTSTRAP_LAST_NAME:Admin}

# Rate limiting (per-IP / per-user; in-memory; single-replica)
# Trust X-Forwarded-For ONLY behind reverse proxies that append (never blindly
# forward) client-supplied XFF. trusted-proxies-count must equal the number of
# such proxies between this app and the public internet (e.g. CDN + ALB = 2).
# A wrong value lets an attacker spoof the rate-limit key — see
# PRODUCTION_CHECKLIST.md for the deployment matrix.
app.ratelimit.enabled=${APP_RATELIMIT_ENABLED:true}
app.ratelimit.trust-forwarded-for=${APP_RATELIMIT_TRUST_XFF:false}
app.ratelimit.trusted-proxies-count=${APP_RATELIMIT_TRUSTED_PROXIES:1}

app.ratelimit.rules.auth-login.method=POST
app.ratelimit.rules.auth-login.pattern=/api/auth/login
app.ratelimit.rules.auth-login.key-strategy=IP
app.ratelimit.rules.auth-login.capacity=10
app.ratelimit.rules.auth-login.refill=PT1M

app.ratelimit.rules.auth-register.method=POST
app.ratelimit.rules.auth-register.pattern=/api/auth/register
app.ratelimit.rules.auth-register.key-strategy=IP
app.ratelimit.rules.auth-register.capacity=5
app.ratelimit.rules.auth-register.refill=PT1M

app.ratelimit.rules.auth-forgot-password.method=POST
app.ratelimit.rules.auth-forgot-password.pattern=/api/auth/forgot-password
app.ratelimit.rules.auth-forgot-password.key-strategy=IP
app.ratelimit.rules.auth-forgot-password.capacity=5
app.ratelimit.rules.auth-forgot-password.refill=PT1H

app.ratelimit.rules.mentorship-request-create.method=POST
app.ratelimit.rules.mentorship-request-create.pattern=/api/mentorship-requests
app.ratelimit.rules.mentorship-request-create.key-strategy=USER
app.ratelimit.rules.mentorship-request-create.capacity=20
app.ratelimit.rules.mentorship-request-create.refill=PT1H

app.ratelimit.rules.message-send.method=POST
app.ratelimit.rules.message-send.pattern=/api/mentorships/*/messages
app.ratelimit.rules.message-send.key-strategy=USER
app.ratelimit.rules.message-send.capacity=60
app.ratelimit.rules.message-send.refill=PT1M

app.ratelimit.rules.mentor-pair-message-send.method=POST
app.ratelimit.rules.mentor-pair-message-send.pattern=/api/conversations/mentor-pair/*/messages
app.ratelimit.rules.mentor-pair-message-send.key-strategy=USER
app.ratelimit.rules.mentor-pair-message-send.capacity=60
app.ratelimit.rules.mentor-pair-message-send.refill=PT1M

# IP-keyed cap on the anonymous iCalendar export endpoint (#250). The path
# is permitAll so calendar apps can subscribe; this rule prevents drive-by
# enumeration of mentor IDs. 30/min per IP is generous for legitimate
# subscription refreshes (calendar apps poll hourly at most).
app.ratelimit.rules.availability-ical.method=GET
app.ratelimit.rules.availability-ical.pattern=/api/availability/*/ical
app.ratelimit.rules.availability-ical.key-strategy=IP
app.ratelimit.rules.availability-ical.capacity=30
app.ratelimit.rules.availability-ical.refill=PT1M

# In-memory oversample window for the matching pipeline (#262/#273). The SQL
# layer fetches up to this many candidates ordered by id DESC, the ranker
# scores them in memory, and the page is sliced from the in-memory ranking.
# Pages beyond the window return empty content. Tune up if the user base
# grows and frontend pagination needs to reach further; tune down if memory
# becomes a concern (each candidate carries its full DTO + collections).
app.matching.ranking-window=${MATCH_RANKING_WINDOW:200}

# Scheduled match-found notification job (#273). Daily 09:00 UTC by default.
# `enabled=false` skips bean creation entirely; `cron=-` keeps the bean wired
# but suppresses firings (Spring 5.1+ documents "-" as the disable marker).
# The cron property must be a valid six-field cron expression OR "-"; empty
# or invalid values fail Spring's CronExpression.parse at startup.
app.matching.notification.enabled=${MATCH_NOTIFICATION_ENABLED:true}
app.matching.notification.cron=${MATCH_NOTIFICATION_CRON:0 0 9 * * *}
app.matching.notification.zone=${MATCH_NOTIFICATION_ZONE:UTC}
