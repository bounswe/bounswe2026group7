name: Mobile CI

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main, dev]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-ci.yml'

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Paketleri yükle
        run: npm ci

      - name: Expo doctor çalıştır
        run: npx expo-doctor

      - name: Type check çalıştır
        run: npx tsc --noEmit

      - name: Lint çalıştır
        run: npm run lint --if-present

      - name: Unit test çalıştır
        run: npm run test:unit --if-present

      - name: Integration test çalıştır
        run: npm run test:integration --if-present
