name: E2E CI (Playwright)

on:
  push:
    branches: [main, dev]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/e2e-ci.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/e2e-ci.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: group7db
          POSTGRES_USER: group7
          POSTGRES_PASSWORD: group7pass
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U group7 -d group7db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend jar
        working-directory: backend
        run: mvn -B package -DskipTests

      - name: Start backend (test endpoints + email disabled)
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/group7db
          SPRING_DATASOURCE_USERNAME: group7
          SPRING_DATASOURCE_PASSWORD: group7pass
          APP_TEST_ENDPOINTS_ENABLED: "true"
          APP_EMAIL_ENABLED: "false"
          # Keep rate limiting on so AT-07 (#317) can exercise the real
          # middleware. AT-01/02 are well under the per-IP login budget
          # (10/min); AT-07 calls /api/test/reset-ratelimits before its
          # 11-login probe so it doesn't leak state into other specs.
          APP_RATELIMIT_ENABLED: "true"
          # Spam-bot defences (#345) require a form-token round-trip and a
          # honeypot field on /api/auth/register. The frontend hasn't been
          # wired up to send them yet, so AT-01 would 400 on every register.
          # Disable in e2e until the frontend integration lands.
          APP_SPAM_ENABLED: "false"
          APP_BASE_URL: http://localhost:8080
          APP_FRONTEND_URL: http://localhost:8000
          APP_CORS_ALLOWED_ORIGINS: http://localhost:8000,http://localhost:5173
          JWT_SECRET: bXlTdXBlclNlY3JldEtleUZvckdyb3VwN0JhY2tlbmRBcHBsaWNhdGlvbjIwMjY=
          RESEND_API_KEY: re_noop_disabled
          # Default upload paths point at /app/uploads/{photos,attachments} —
          # those don't exist on a bare GitHub runner. Redirect to /tmp like
          # application-test.properties does, so any startup-time directory
          # check passes.
          UPLOAD_DIR: /tmp/group7-e2e/photos
          UPLOAD_ATTACHMENTS_DIR: /tmp/group7-e2e/attachments
        run: |
          mkdir -p /tmp/group7-e2e/photos /tmp/group7-e2e/attachments
          ls -la target/*.jar
          # Pin to the executable Spring Boot fat jar; the .original sibling
          # (un-repackaged) shouldn't be matched but be explicit anyway.
          JAR=$(ls target/*.jar | grep -v '\.original$' | head -1)
          echo "Launching: $JAR"
          nohup java -jar "$JAR" > backend.log 2>&1 &
          echo $! > backend.pid
          # Give the JVM a chance to exit immediately on a fatal config error
          # so we surface it here instead of after a 4-minute wait-on timeout.
          sleep 5
          if ! kill -0 "$(cat backend.pid)" 2>/dev/null; then
            echo "::error::Backend process died within 5s of launch. backend.log:"
            sed 's/^/[backend] /' backend.log || true
            exit 1
          fi
          echo "Backend PID $(cat backend.pid) is alive after 5s; proceeding."

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Wait for backend to be ready
        run: |
          set +e
          # Tail backend.log to stdout in the background so progress is
          # visible during startup instead of only on failure.
          ( tail -F -n +1 backend/backend.log 2>/dev/null | sed 's/^/[backend] /' ) &
          TAIL_PID=$!
          npx --yes wait-on -t 240000 -i 2000 http://localhost:8080/actuator/health
          rc=$?
          # Stop the tailer regardless of outcome.
          kill "$TAIL_PID" 2>/dev/null || true
          if [ "$rc" -ne 0 ]; then
            echo "::error::Backend never became healthy. Diagnostic context follows."
            echo "---- ps (java) ----"
            ps -ef | grep -E '[j]ava' || echo "no java process found"
            echo "---- listening ports ----"
            ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null || true
            echo "---- backend.log (full) ----"
            sed 's/^/[backend] /' backend/backend.log || true
            exit "$rc"
          fi

      - name: Warm up backend auth path
        # /actuator/health is excluded from the Spring Security filter chain,
        # so wait-on'ing it confirms the JVM is up but never exercises the
        # /api/auth/* path. The first Playwright login is therefore the first
        # request through the whole security chain (JIT-cold filters, Jackson
        # reflective deserialisation, Hibernate metadata for users, the
        # rate-limit interceptor, etc.) — measured locally at ~200ms cold vs
        # ~6ms warm, a 30x speedup. On a contended GitHub runner the cold
        # path occasionally exceeds AT-02's 30s waitForResponse budget and
        # the spec fails with a TimeoutError that has nothing to do with the
        # code under test.
        #
        # One throwaway POST with bogus credentials triggers a 401 (AuthService
        # short-circuits on "user not found" before BCrypt, so this won't
        # warm BCrypt itself — that JIT-warms on AT-01's real login) but
        # does pay every other cold cost. Rate-limit budget is 10/min per
        # IP; this uses 1, leaving 9 for AT-01. AT-07 calls
        # /api/test/reset-ratelimits before its own probe so it's unaffected.
        run: |
          set +e
          curl -sS -o /dev/null -w "warmup login HTTP %{http_code} in %{time_total}s\n" \
            --max-time 30 \
            -X POST http://localhost:8080/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"e2e-warmup@nonexistent.invalid","password":"warmup"}' || true
          # Non-fatal: if the warmup itself times out we still want Playwright
          # to run and produce its own diagnostics rather than failing here.
          exit 0

      - name: Build and start frontend preview
        working-directory: frontend
        env:
          VITE_BACKEND_URL: http://localhost:8080
        run: |
          npm run build
          nohup npx vite preview --port 8000 --host 0.0.0.0 --strictPort > frontend.log 2>&1 &
          echo $! > frontend.pid

      - name: Wait for frontend to be ready
        run: |
          set +e
          npx --yes wait-on -t 120000 -i 2000 http://localhost:8000
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Frontend preview never came up. Dumping frontend.log:"
            sed 's/^/[frontend] /' frontend/frontend.log || true
            exit "$rc"
          fi

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run Playwright suite
        working-directory: frontend
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:8000
          E2E_BACKEND_URL: http://localhost:8080
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend/backend.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload frontend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-log
          path: frontend/frontend.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop background processes
        if: always()
        run: |
          [ -f backend/backend.pid ] && kill "$(cat backend/backend.pid)" || true
          [ -f frontend/frontend.pid ] && kill "$(cat frontend/frontend.pid)" || true
