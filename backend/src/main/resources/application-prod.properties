# ===== Production Profile Overrides =====
# Inherits all defaults from application.properties.
# Activated via SPRING_PROFILES_ACTIVE=prod

# Disable SQL logging
spring.jpa.show-sql=false

# Ensure Flyway validates only (no auto-DDL)
spring.jpa.hibernate.ddl-auto=validate

# SSL for managed database (DigitalOcean requires SSL)
spring.datasource.hikari.data-source-properties.sslmode=require

# Production mail — require SMTP authentication and TLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging — quieter in production
logging.level.root=WARN
logging.level.com.group7.backend=INFO

# Disable Swagger UI and API docs in production
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Lock down Content-Security-Policy in production:
#   - drop 'unsafe-eval' from script-src (dev tooling only)
#   - drop http://localhost:8080 from connect-src (dev SPA only); keep wss/https
app.security.csp.script-src='self' 'unsafe-inline'
app.security.csp.connect-src='self' wss: https:
