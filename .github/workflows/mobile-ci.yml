name: Mobile CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  mobile-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Paketleri yükle
        run: npm ci

      - name: Expo doctor çalıştır
        run: npx expo-doctor

      - name: Lint çalıştır
        run: npm run lint --if-present

      - name: Test çalıştır
        run: npm test --if-present
